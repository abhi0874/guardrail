[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
license = "Apache-2.0"
name = "guardrail-offline-scanner"
version = "0.1.0"
description = "Passive detector, offline benchmark, and evidence contracts"
readme = "README.md"
requires-python = ">=3.11"
maintainers = [{ name = "abhi0874" }]
classifiers = ["Programming Language :: Python :: 3.11"]
dependencies = [
    "jsonschema==4.23.0",
    "pydantic==2.14.2",
]

[project.urls]
Repository = "https://github.com/abhi0874/guardrail"
Documentation = "https://github.com/abhi0874/guardrail/blob/main/docs/DISTRIBUTION.md"
Issues = "https://github.com/abhi0874/guardrail/issues"

[project.scripts]
guardrail-offline-scanner = "agent_security_scanner.detectors.__main__:main"

[dependency-groups]
dev = [
  "mypy==1.15.0",
  "types-jsonschema==4.26.0.20261006",
  "pytest==9.2.0",
  "ruff==0.11.13",
]

[tool.hatch.build.targets.wheel]
packages = ["core/agent_security_scanner", "api/scanner_api"]

[tool.hatch.build.targets.wheel.force-include]
"data/detector_validation" = "agent_security_scanner/_bundle/data/detector_validation"
"api/schemas" = "agent_security_scanner/_bundle/api/schemas"

[tool.hatch.build.targets.sdist]
include = ["/core", "/api", "/data/detector_validation", "/LICENSE", "/README.md", "/DETECTOR-METHODOLOGY.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["core", "api"]
