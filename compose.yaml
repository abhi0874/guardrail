services:
  mcp:
    build:
      context: .
      target: runtime
    image: mcp-agent-server:local
    user: "10001:10001"
    init: true
    stdin_open: true
    tty: false
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 10s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    volumes:
      - audit:/app/.runtime
volumes:
  audit:
