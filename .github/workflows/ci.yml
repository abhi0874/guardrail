name: Local correctness and container verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.10"
      - name: Validate repository hygiene
        run: python3 scripts/repository_check.py
      - name: Build isolated verification environment (dependency setup)
        run: docker build -f Dockerfile.ci -t mcp-checks:ci .
      - name: Build pinned PostgreSQL and pgvector test fixture
        run: docker build -t guardrail-test-db:pg17.12-vector0.8.7-r1 tests/postgresql
      - name: Start disposable isolated PostgreSQL
        run: >-
          docker run --name mcp-test-db --network none --memory 256m --cpus 1
          --pids-limit 128 -d -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=mcp_test
          --pull=never guardrail-test-db:pg17.12-vector0.8.7-r1
      - name: Deterministic tests without external networking
        run: >-
          docker run --name mcp-checks --network container:mcp-test-db
          -e MCP_TEST_POSTGRES_PORT=5432 --cpus 2 --memory 2g --pids-limit 512 mcp-checks:ci
      - name: Copy sanitized summaries
        if: always()
        run: |
          mkdir -p reports
          docker cp mcp-checks:/app/.cache/reports/. reports/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-correctness
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build runtime images
        run: |
          docker build -t mcp-agent-server:ci .
          docker build -f Dockerfile.cloud -t mcp-agent-server:cloud-ci .
      - name: Install locked smoke-client dependencies (setup only)
        run: uv sync --frozen --python 3.11.18
      - name: Runtime smoke, persistence and shutdown
        run: uv run --frozen python scripts/container_smoke.py --image mcp-agent-server:ci
      - name: Remove disposable test database
        if: always()
        run: docker rm -f mcp-test-db || true
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      FRONTEND_ORIGIN: http://127.0.0.1:4183
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.10"
      - name: Set up the local MCP and Scanner runner for browser tests
        working-directory: .
        run: uv sync --frozen --python 3.11.18
      - name: Validate passive evidence classifiers
        working-directory: .
        run: uv run --frozen pytest -q --no-cov security-tests/test_observation_classifiers.py
      - name: Validate offline Scanner and frozen data
        working-directory: security-tests/scanner
        run: |
          uv sync --frozen --python 3.11.18
          uv run --frozen pytest -q
          uv run --frozen python -m agent_security_scanner.detectors validate
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Frontend lint and strict types
        run: npm run lint && npm run typecheck
      - name: Production frontend build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Local production interactions and security boundaries
        run: npm test
      - name: Dependency review
        run: npm audit
