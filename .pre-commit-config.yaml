repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: format
        name: Ruff formatting
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Strict mypy
        entry: uv run --frozen mypy src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: tests
        name: Pytest and coverage
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
        always_run: true
